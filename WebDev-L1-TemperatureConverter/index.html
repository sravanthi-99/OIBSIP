<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="converter">
            <p class="small-text">TEMPERATURE TOOL</p>
            <h1>Temperature<br><span>Converter</span></h1>
            <p class="description">
                Convert temperatures quickly between Celsius,
                Fahrenheit and Kelvin.
            </p>
            <label for="temperature">Enter Temperature</label>
            <input type="number" id="temperature" placeholder="Enter value">
            <label for="unit">Select Unit</label>
            <select id="unit">
                <option value="celsius">Celsius</option>
                <option value="fahrenheit">Fahrenheit</option>
                <option value="kelvin">Kelvin</option>
            </select>
            <button onclick="convertTemperature()">Convert Temperature</button>
            <div id="result">
                Your result will appear here
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
